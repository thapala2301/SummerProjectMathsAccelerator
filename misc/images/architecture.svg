<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrfb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#0f172a;font-weight:600;}
      .s{font-size:11px;fill:#475569;}
      .own{font-size:10px;font-weight:700;letter-spacing:.5px;}
      .edge{stroke:#64748b;stroke-width:1.8;fill:none;}
      .fb{stroke:#dc2626;stroke-width:1.8;fill:none;stroke-dasharray:5 4;}
      .lbl{font-size:10.5px;fill:#64748b;}
      .fblbl{font-size:10.5px;fill:#dc2626;font-weight:600;}
      .ink{fill:#0f172a;}
      .muted{fill:#475569;}
      @media (prefers-color-scheme: dark){ .ink{fill:#f1f5f9;} .muted{fill:#cbd5e1;} }
    </style>
  </defs>
  <text x="30" y="34" class="ink" font-size="19" font-weight="700">Audio-Sync Ray Marcher - System Architecture (PYNQ-Z1)</text>
  <text x="30" y="54" class="muted" font-size="11.5">Programmable Logic (PL) pipeline + Processing System (PS) control - custom 27-bit float datapath</text>
  <g transform="translate(625,72)">
    <rect x="0" y="0" width="305" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="20" class="own" fill="#1d4ed8">GERALT</text><text x="92" y="20" class="s">Audio FFT</text>
    <text x="12" y="40" class="own" fill="#15803d">JAI</text><text x="92" y="40" class="s">Ray generation</text>
    <text x="12" y="60" class="own" fill="#c2410c">THANUS</text><text x="92" y="60" class="s">Scheduling / FFT bridge</text>
    <text x="12" y="80" class="own" fill="#7c3aed">VINCENT</text><text x="92" y="80" class="s">Marcher core / SDF</text>
    <text x="12" y="100" class="own" fill="#0d9488">SAKTHIVEL</text><text x="92" y="100" class="s">HDMI output</text>
    <text x="200" y="100" class="own" fill="#64748b">PS</text><text x="232" y="100" class="s">ARM/Python</text>
  </g>
  <rect x="285" y="78" width="200" height="38" rx="8" fill="#eef2ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="385" y="102" text-anchor="middle">Audio In - 44.1 kHz</text>
  <rect x="250" y="140" width="270" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="own" x="262" y="158" fill="#1d4ed8">GERALT - PL</text>
  <text class="t" x="385" y="176" text-anchor="middle">Xilinx FFT IP (1024-pt, AXI-Stream)</text>
  <rect x="250" y="206" width="270" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="own" x="262" y="224" fill="#1d4ed8">GERALT - PL</text>
  <text class="t" x="385" y="242" text-anchor="middle">AXI DMA -&gt; DDR</text>
  <rect x="250" y="272" width="270" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="own" x="262" y="290" fill="#64748b">GERALT - PS (Python/NumPy)</text>
  <text class="t" x="385" y="308" text-anchor="middle">Band extract: bass / mid / high</text>
  <rect x="250" y="338" width="270" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text class="own" x="262" y="356" fill="#c2410c">THANUS - PL</text>
  <text class="t" x="385" y="374" text-anchor="middle">fft_bridge -&gt; SDF params (frame-stable)</text>
  <rect x="600" y="404" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="own" x="612" y="422" fill="#64748b">PS - AXI-Lite</text>
  <text class="t" x="695" y="440" text-anchor="middle" font-size="13">axi_camera_regs</text>
  <rect x="250" y="404" width="270" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text class="own" x="262" y="422" fill="#15803d">JAI - PL</text>
  <text class="t" x="385" y="440" text-anchor="middle">ray_gen -&gt; ray_orig[3] + ray_dir[3]</text>
  <rect x="250" y="470" width="270" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text class="own" x="262" y="488" fill="#c2410c">THANUS - PL</text>
  <text class="t" x="385" y="506" text-anchor="middle">pixel_dispatch (1 px/clk)</text>
  <rect x="250" y="536" width="270" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text class="own" x="262" y="554" fill="#c2410c">THANUS - PL</text>
  <text class="t" x="385" y="572" text-anchor="middle">feedback_ctrl + FIFO (190x128)</text>
  <rect x="250" y="602" width="270" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="own" x="262" y="620" fill="#7c3aed">VINCENT - PL</text>
  <text class="t" x="385" y="638" text-anchor="middle">march_core (step ray)</text>
  <rect x="600" y="602" width="190" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="own" x="612" y="620" fill="#7c3aed">VINCENT</text>
  <text class="t" x="695" y="638" text-anchor="middle" font-size="13">scene_sdf / neural</text>
  <rect x="250" y="668" width="270" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text class="own" x="262" y="686" fill="#0d9488">SAKTHIVEL - PL</text>
  <text class="t" x="385" y="704" text-anchor="middle">iter_to_rgb (iter -&gt; 24-bit RGB)</text>
  <rect x="250" y="734" width="270" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text class="own" x="262" y="752" fill="#c2410c">THANUS - PL</text>
  <text class="t" x="385" y="770" text-anchor="middle">fb_write (BRAM write port)</text>
  <rect x="250" y="800" width="270" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text class="own" x="262" y="818" fill="#0d9488">SAKTHIVEL - PL</text>
  <text class="t" x="385" y="836" text-anchor="middle">framebuffer_bram (RGB332)</text>
  <rect x="250" y="866" width="270" height="44" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text class="own" x="262" y="884" fill="#0d9488">SAKTHIVEL - PL - 74.25 MHz</text>
  <text class="t" x="385" y="902" text-anchor="middle">scan_out + hdmi_timing -&gt; HDMI 720p60</text>
  <path class="edge" d="M385,116 V140" marker-end="url(#arr)"/>
  <path class="edge" d="M385,184 V206" marker-end="url(#arr)"/>
  <path class="edge" d="M385,250 V272" marker-end="url(#arr)"/>
  <path class="edge" d="M385,316 V338" marker-end="url(#arr)"/>
  <path class="edge" d="M385,382 V404" marker-end="url(#arr)"/>
  <path class="edge" d="M385,448 V470" marker-end="url(#arr)"/>
  <path class="edge" d="M385,514 V536" marker-end="url(#arr)"/>
  <path class="edge" d="M385,580 V602" marker-end="url(#arr)"/>
  <path class="edge" d="M385,646 V668" marker-end="url(#arr)"/>
  <path class="edge" d="M385,712 V734" marker-end="url(#arr)"/>
  <path class="edge" d="M385,778 V800" marker-end="url(#arr)"/>
  <path class="edge" d="M385,844 V866" marker-end="url(#arr)"/>
  <path class="edge" d="M600,426 H520" marker-end="url(#arr)"/>
  <path class="edge" d="M520,618 H600" marker-end="url(#arr)"/>
  <text class="lbl" x="560" y="612" text-anchor="middle">query</text>
  <path class="edge" d="M695,646 V658 H530 V646" marker-end="url(#arr)"/>
  <text class="lbl" x="560" y="672" text-anchor="middle">dist</text>
  <path class="fb" d="M250,624 H150 V558 H250" marker-end="url(#arrfb)"/>
  <text class="fblbl" x="156" y="592">re-iterate</text>
  <text class="fblbl" x="100" y="610" font-size="9">(miss -&gt; FIFO)</text>
  <path class="edge" d="M385,910 V934" marker-end="url(#arr)"/>
  <rect x="300" y="934" width="170" height="22" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="385" y="950" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HDMI Display</text>
</svg>
