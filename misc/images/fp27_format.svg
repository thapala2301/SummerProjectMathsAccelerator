<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .ink{fill:#0f172a;} .muted{fill:#475569;} .idx{fill:#64748b;}
      @media (prefers-color-scheme: dark){ .ink{fill:#f1f5f9;} .muted{fill:#cbd5e1;} .idx{fill:#94a3b8;} }
    </style>
  </defs>
  <text x="30" y="34" class="ink" font-size="18" font-weight="700">Custom 27-bit Floating-Point Format</text>
  <text x="30" y="55" class="muted" font-size="12">value = (-1)^sign x 1.mantissa x 2^(exponent - 127)   -   implicit leading 1   -   bias 127</text>
  <rect x="30" y="80" width="30" height="46" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="60" y="80" width="240" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="300" y="80" width="540" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <g stroke="#93c5fd" stroke-width="0.7">
    <line x1="90" y1="80" x2="90" y2="126"/><line x1="120" y1="80" x2="120" y2="126"/>
    <line x1="150" y1="80" x2="150" y2="126"/><line x1="180" y1="80" x2="180" y2="126"/>
    <line x1="210" y1="80" x2="210" y2="126"/><line x1="240" y1="80" x2="240" y2="126"/>
    <line x1="270" y1="80" x2="270" y2="126"/>
  </g>
  <g stroke="#86efac" stroke-width="0.7">
    <line x1="330" y1="80" x2="330" y2="126"/><line x1="360" y1="80" x2="360" y2="126"/>
    <line x1="390" y1="80" x2="390" y2="126"/><line x1="420" y1="80" x2="420" y2="126"/>
    <line x1="450" y1="80" x2="450" y2="126"/><line x1="480" y1="80" x2="480" y2="126"/>
    <line x1="510" y1="80" x2="510" y2="126"/><line x1="540" y1="80" x2="540" y2="126"/>
    <line x1="570" y1="80" x2="570" y2="126"/><line x1="600" y1="80" x2="600" y2="126"/>
    <line x1="630" y1="80" x2="630" y2="126"/><line x1="660" y1="80" x2="660" y2="126"/>
    <line x1="690" y1="80" x2="690" y2="126"/><line x1="720" y1="80" x2="720" y2="126"/>
    <line x1="750" y1="80" x2="750" y2="126"/><line x1="780" y1="80" x2="780" y2="126"/>
    <line x1="810" y1="80" x2="810" y2="126"/>
  </g>
  <text x="45" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">S</text>
  <text x="180" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">exponent (8 bits)</text>
  <text x="570" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">mantissa (18 bits)</text>
  <text x="45" y="142" text-anchor="middle" font-size="10" class="idx">26</text>
  <text x="75" y="142" text-anchor="middle" font-size="10" class="idx">25</text>
  <text x="285" y="142" text-anchor="middle" font-size="10" class="idx">18</text>
  <text x="315" y="142" text-anchor="middle" font-size="10" class="idx">17</text>
  <text x="825" y="142" text-anchor="middle" font-size="10" class="idx">0</text>
  <g transform="translate(30,176)">
    <text x="0" y="0" class="ink" font-size="12.5" font-weight="700">vs IEEE-754 single (32-bit):</text>
    <text x="0" y="20" class="muted" font-size="11.5">IEEE = 1 sign / 8 exp / 23 mantissa.  This format keeps the 8-bit exponent (same range)</text>
    <text x="0" y="37" class="muted" font-size="11.5">but trims the mantissa to 18 bits, so the 19-bit product (incl. implicit 1s) fits one DSP48 multiplier.</text>
  </g>
  <g transform="translate(30,238)">
    <rect x="0" y="0" width="810" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#0f172a">Example - encode 1.0</text>
    <text x="14" y="42" font-size="11.5" fill="#334155" font-family="Consolas, monospace">sign=0 / exp = 0+127 = 127 = 0x7F / mantissa = 0 (leading 1 implicit)</text>
    <text x="14" y="56" font-size="11.5" fill="#334155" font-family="Consolas, monospace">bits = 0 01111111 000000000000000000  =&gt;  27'h1FC0000   (FP_ONE in top.sv)</text>
  </g>
</svg>
