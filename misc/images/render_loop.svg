<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="afb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="ahit" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <style>
      .ink{fill:#0f172a;}
      .muted{fill:#475569;}
      @media (prefers-color-scheme: dark){
        .ink{fill:#f1f5f9;}
        .muted{fill:#cbd5e1;}
      }
    </style>
  </defs>
  <text x="30" y="34" class="ink" font-size="18" font-weight="700">Per-Pixel Render Loop</text>
  <text x="30" y="54" class="muted" font-size="11.5">A pixel may circulate many times - one marching step per lap - until it hits a surface or the step limit.</text>
  <rect x="40" y="120" width="150" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="115" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">pixel_dispatch</text>
  <text x="115" y="160" text-anchor="middle" font-size="10.5" fill="#475569">fresh pixel (x,y)</text>
  <rect x="250" y="120" width="170" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="335" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">feedback_ctrl + FIFO</text>
  <text x="335" y="160" text-anchor="middle" font-size="10.5" fill="#475569">arbiter: returning wins</text>
  <rect x="480" y="120" width="150" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="555" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ray_gen</text>
  <text x="555" y="160" text-anchor="middle" font-size="10.5" fill="#475569">origin + dir (27b FP)</text>
  <rect x="690" y="120" width="190" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="785" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">march_core</text>
  <text x="785" y="160" text-anchor="middle" font-size="10.5" fill="#475569">step via scene_sdf</text>
  <rect x="690" y="225" width="190" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="785" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">scene_sdf</text>
  <text x="785" y="262" text-anchor="middle" font-size="10.5" fill="#475569">distance to surface</text>
  <rect x="470" y="320" width="170" height="46" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="555" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">iter_to_rgb</text>
  <text x="555" y="357" text-anchor="middle" font-size="10.5" fill="#475569">iter -&gt; RGB</text>
  <rect x="250" y="320" width="170" height="46" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="335" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">fb_write -&gt; BRAM</text>
  <text x="335" y="357" text-anchor="middle" font-size="10.5" fill="#475569">store pixel colour</text>
  <path d="M190,145 H250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M420,145 H480" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M630,145 H690" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M785,170 V225" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M690,248 H470 V200 Q335,200 335,170" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#afb)"/>
  <text x="500" y="215" font-size="11" font-weight="600" fill="#dc2626">miss -&gt; re-iterate (carry pos, dir, iter)</text>
  <path d="M785,271 V295 H640 V343" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ahit)"/>
  <text x="660" y="290" font-size="11" font-weight="600" fill="#16a34a">hit / limit</text>
  <path d="M470,343 H420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(40,300)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#64748b" stroke-width="1.8"/><text x="32" y="4" font-size="10.5" class="muted">forward</text>
    <line x1="0" y1="18" x2="26" y2="18" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/><text x="32" y="22" font-size="10.5" fill="#dc2626">feedback</text>
    <line x1="0" y1="36" x2="26" y2="36" stroke="#16a34a" stroke-width="1.8"/><text x="32" y="40" font-size="10.5" fill="#16a34a">hit -&gt; output</text>
  </g>
</svg>
